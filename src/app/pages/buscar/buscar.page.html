<ion-header>
  <ion-toolbar>
    <ion-title>Buscar</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      placeholder="Buscar canciones o artistas..."
      [value]="terminoBusqueda"
      (ionInput)="onInput($event)"
      debounce="0"
      animated>
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>

  <!-- Cargando -->
  <div *ngIf="cargando" class="center-state">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
  </div>

  <!-- Sin búsqueda aún -->
  <div *ngIf="!cargando && !buscado" class="center-state">
    <ion-icon name="musical-notes"></ion-icon>
    <p>Busca canciones por título o artista</p>
  </div>

  <!-- Sin resultados -->
  <div *ngIf="!cargando && buscado && resultados.length === 0" class="center-state">
    <ion-icon name="musical-notes"></ion-icon>
    <p>No se encontraron resultados para "{{ terminoBusqueda }}"</p>
  </div>

  <!-- Resultados -->
  <ion-list *ngIf="!cargando && resultados.length > 0">
    <ion-item
      *ngFor="let cancion of resultados"
      button
      (click)="reproducirCancion(cancion)">

      <ion-icon slot="start" name="musical-notes" color="primary"></ion-icon>

      <ion-label>
        <h3>{{ cancion.titulo }}</h3>
        <p>{{ cancion.artista }} · {{ cancion.album }}</p>
      </ion-label>

      <ion-note slot="end" class="duracion">
        {{ formatearDuracion(cancion.duracionSegundos) }}
      </ion-note>

      <ion-button
        fill="clear"
        slot="end"
        (click)="anadirAPlaylist(cancion, $event)">
        <ion-icon slot="icon-only" name="add-circle-outline" color="medium"></ion-icon>
      </ion-button>

    </ion-item>
  </ion-list>

</ion-content>
